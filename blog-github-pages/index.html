<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个部署在 GitHub Pages 上的静态个人博客">
  <title>我的博客</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="eyebrow">MY PERSONAL SPACE</p>
        <h1>我的博客</h1>
        <p class="subtitle">分享知识、记录生活与思考</p>
      </div>
      <button id="new-post-button" class="button button-light" type="button">＋ 写新文章</button>
    </div>
  </header>

  <main class="page-shell">
    <section id="list-view" aria-labelledby="posts-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow dark">LATEST WRITING</p>
          <h2 id="posts-title">最近文章</h2>
        </div>
        <span id="post-count" class="count-pill"></span>
      </div>
      <div id="post-list" class="post-list"></div>
    </section>

    <article id="detail-view" class="detail-card hidden"></article>

    <section id="editor-view" class="editor-card hidden" aria-labelledby="editor-title">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow dark">EDITOR</p>
          <h2 id="editor-title">写新文章</h2>
        </div>
      </div>
      <form id="post-form">
        <input id="post-id" type="hidden">
        <label>标题<input id="title" type="text" maxlength="80" required placeholder="输入文章标题"></label>
        <label>作者<input id="author" type="text" maxlength="30" required value="博主"></label>
        <label>内容<textarea id="content" rows="12" required placeholder="开始写作……"></textarea></label>
        <div class="form-actions">
          <button id="cancel-button" class="button button-ghost" type="button">取消</button>
          <button class="button button-primary" type="submit">保存文章</button>
        </div>
      </form>
    </section>
  </main>

  <footer>© <span id="year"></span> 我的博客 · 使用 GitHub Pages</footer>
  <script src="app.js"></script>
</body>
</html>
