<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="一个可部署在 GitHub Pages 上的个人图文博客"><title>我的博客</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="hero"><nav class="topbar"><a class="brand" href="#">BLOG.</a><div class="account-area"><button id="theme-button" class="button theme-button" type="button" aria-pressed="false">🌿 护眼模式</button><div id="account-area" class="account-area"></div></div></nav><div class="hero-inner"><div><p class="eyebrow">MY PERSONAL SPACE</p><h1>我的博客</h1><p class="subtitle">分享知识、照片、生活与思考</p></div><button id="new-post-button" class="button button-light">＋ 写新文章</button></div></header>
<main class="page-shell"><section id="list-view"><div class="section-heading"><div><p class="eyebrow dark">LATEST WRITING</p><h2>最近文章</h2></div><div class="list-tools"><button id="sort-button" class="button button-ghost button-small">按热度排序</button><span id="post-count" class="count-pill"></span></div></div><div id="post-list" class="post-list"></div></section><article id="detail-view" class="detail-card hidden"></article>
<section id="editor-view" class="editor-card hidden"><div class="section-heading compact"><div><p class="eyebrow dark">EDITOR</p><h2 id="editor-title">写新文章</h2></div></div><form id="post-form"><input id="post-id" type="hidden"><label>标题<input id="title" maxlength="80" required placeholder="输入文章标题"></label><label>作者<input id="author" maxlength="30" required></label><label>内容<textarea id="content" rows="12" required placeholder="开始写作……"></textarea></label><label>添加照片<input id="photos" type="file" accept="image/*" multiple><span class="field-hint">最多 6 张，每张不超过 2MB；照片会压缩后保存在当前浏览器。</span></label><div id="photo-preview" class="photo-preview"></div><div class="form-actions"><button id="cancel-button" class="button button-ghost" type="button">取消</button><button class="button button-primary">保存文章</button></div></form></section></main>
<div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><button class="modal-close" data-action="close-auth" aria-label="关闭">×</button><p class="eyebrow dark">MEMBER</p><h2 id="auth-title">登录</h2><p class="auth-note">使用邮箱注册，文章和照片会同步到云端。</p><form id="auth-form"><label>邮箱<input id="username" type="email" required autocomplete="email" placeholder="name@example.com"></label><label>密码<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><p id="auth-error" class="error"></p><button class="button button-primary">继续</button></form><button id="auth-switch" class="text-button">没有账户？立即注册</button></div></div><div id="toast" class="toast hidden"></div><footer>© <span id="year"></span> 我的博客 · 使用 GitHub Pages</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
